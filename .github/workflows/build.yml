
name: Build Unity iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Xcode Project
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity Project
        shell: bash
        run: |
          test -f AntchemyUnity/ProjectSettings/ProjectVersion.txt || {
            echo "::error::Unity project not found"
            exit 1
          }

          echo "Available Unity scenes:"
          find AntchemyUnity/Assets -type f -name "*.unity" -print

          if [ ! -f AntchemyUnity/Assets/Scenes/MainGame.unity ]; then
            echo "::error::MainGame.unity is missing from GitHub"
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: AntchemyUnity/Library
          key: Library-iOS-${{ hashFiles('AntchemyUnity/Assets/**', 'AntchemyUnity/Packages/**', 'AntchemyUnity/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Unity iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: AntchemyUnity
          targetPlatform: iOS
          buildsPath: build

      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Xcode-Project
          path: build/iOS
          if-no-files-found: error
          retention-days: 7
