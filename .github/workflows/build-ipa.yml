
name: Sign iOS IPA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Unity build run ID"
        required: true
        default: "42348247593"

permissions:
  contents: read
  actions: read

jobs:
  sign-ipa:
    name: Create Signed IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Unity Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: iOS-Xcode-Project
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: build/iOS

      - name: Locate Xcode Project
        shell: bash
        run: |
          PROJECT=$(find build/iOS -type d -name "Unity-iPhone.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::Unity Xcode project not found"
            exit 1
          fi

          echo "IOS_PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane and CocoaPods
        run: gem install fastlane cocoapods --no-document

      - name: Install iOS Dependencies
        shell: bash
        run: |
          if [ -f "$IOS_PROJECT_DIR/Podfile" ]; then
            cd "$IOS_PROJECT_DIR"
            pod install --repo-update
          fi

      - name: Fix Script Permissions
        run: |
          find "$IOS_PROJECT_DIR" -type f -name "*.sh" -exec chmod +x {} +

      - name: Configure Fastlane
        shell: bash
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          require "base64"

          default_platform(:ios)

          platform :ios do
            lane :signed_ipa do
              bundle_id = ENV.fetch("IOS_BUNDLE_ID")
              team_id = ENV.fetch("APPLE_TEAM_ID")
              ios_dir = ENV.fetch("IOS_PROJECT_DIR")
              project = File.join(ios_dir, "Unity-iPhone.xcodeproj")
              workspace = File.join(ios_dir, "Unity-iPhone.xcworkspace")

              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("APPSTORE_KEY_ID"),
                issuer_id: ENV.fetch("APPSTORE_ISSUER_ID"),
                key_content: ENV.fetch("APPSTORE_P8"),
                in_house: false
              )

              setup_ci

              match(
                type: "appstore",
                storage_mode: "git",
                git_url: "https://github.com/ZAKARDA/ios-signing-certificates.git",
                git_branch: "main",
                git_basic_authorization: Base64.strict_encode64(
                  "x-access-token:#{ENV.fetch('SIGNING_REPO_TOKEN')}"
                ),
                app_identifier: bundle_id,
                team_id: team_id,
                api_key: api_key,
                readonly: false
              )

              profile_name = ENV.fetch(
                "sigh_#{bundle_id}_appstore_profile-name"
              )

              update_code_signing_settings(
                path: project,
                use_automatic_signing: true,
                team_id: team_id
              )

              update_code_signing_settings(
                path: project,
                use_automatic_signing: false,
                targets: ["Unity-iPhone"],
                team_id: team_id,
                bundle_identifier: bundle_id,
                code_sign_identity: "Apple Distribution",
                profile_name: profile_name
              )

              options = {
                scheme: "Unity-iPhone",
                configuration: "Release",
                clean: true,
                export_options: {
                  method: "app-store-connect",
                  signingStyle: "manual",
                  teamID: team_id,
                  provisioningProfiles: {
                    bundle_id => profile_name
                  }
                },
                output_directory: "signed-ipa",
                output_name: "AntColonyColors.ipa"
              }

              if File.exist?(workspace)
                options[:workspace] = workspace
              else
                options[:project] = project
              end

              build_app(**options)
            end
          end
          RUBY

      - name: Build Signed IPA
        env:
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          SIGNING_REPO_TOKEN: ${{ secrets.SIGNING_REPO_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: fastlane ios signed_ipa

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: AntColonyColors-Signed-IPA
          path: signed-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
