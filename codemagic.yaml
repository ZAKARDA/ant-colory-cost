
workflows:
  ios-release:
    name: Ant Colony Colors - Signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: AntColonyKey

    environment:
      groups:
        - github_artifact

      ios_signing:
        certificates:
          - AntColonyAppStoreCert
        provisioning_profiles:
          - AntColonyAppStoreProfile

      vars:
        GITHUB_REPO: "ZAKARDA/ant-colory-cost"
        GITHUB_RUN_ID: "43248247593"
        IOS_BUNDLE_ID: "com.antcolonycolors.game"

      xcode: latest
      cocoapods: default

    scripts:
      - name: Download Unity Xcode Project
        script: |
          set -euo pipefail

          : "${GITHUB_ARTIFACT_TOKEN:?Missing GitHub token}"

          API="https://api.github.com/repos/$GITHUB_REPO"

          echo "Fetching Unity iOS build artifact..."

          curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ARTIFACT_TOKEN" \
            "$API/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            -o /tmp/artifacts.json

          ARTIFACT_ID="$(python3 - <<'PY'
          import json

          with open("/tmp/artifacts.json") as f:
              data = json.load(f)

          matches = [
              a for a in data.get("artifacts", [])
              if a.get("name") == "iOS-Xcode-Project"
              and not a.get("expired", False)
          ]

          if not matches:
              raise SystemExit(
                  "ERROR: iOS artifact not found or expired"
              )

          print(matches[0]["id"])
          PY
          )"

          echo "Downloading artifact ID: $ARTIFACT_ID"

          curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ARTIFACT_TOKEN" \
            "$API/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/ios-project.zip

          mkdir -p "$CM_BUILD_DIR/ios-export"

          unzip -q /tmp/ios-project.zip \
            -d "$CM_BUILD_DIR/ios-export"

          PROJECT=$(find "$CM_BUILD_DIR/ios-export" \
            -type d -name "Unity-iPhone.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Unity Xcode project not found"
            exit 1
          fi

          IOS_DIR=$(dirname "$PROJECT")

          echo "IOS_DIR=$IOS_DIR" >> "$CM_ENV"

          echo "Unity Xcode project ready!"
          echo "Project: $PROJECT"

      - name: Install CocoaPods Dependencies
        script: |
          set -e
          cd "$IOS_DIR"

          if [ -f "Podfile" ]; then
            echo "Installing iOS dependencies..."
            pod install --repo-update
          else
            echo "No Podfile found. Skipping CocoaPods."
          fi

      - name: Fix Script Permissions
        script: |
          find "$IOS_DIR" -type f -name "*.sh" \
            -exec chmod +x {} \;

      - name: Configure Apple Code Signing
        script: |
          set -e
          cd "$IOS_DIR"

          xcode-project use-profiles \
            --project "$IOS_DIR/Unity-iPhone.xcodeproj"

      - name: Build Signed IPA
        script: |
          set -e
          cd "$IOS_DIR"

          echo "Building Ant Colony Colors IPA..."

          if [ -d "Unity-iPhone.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "$IOS_DIR/Unity-iPhone.xcworkspace" \
              --scheme "Unity-iPhone"
          else
            xcode-project build-ipa \
              --project "$IOS_DIR/Unity-iPhone.xcodeproj" \
              --scheme "Unity-iPhone"
          fi

          echo "IPA build step completed!"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
