# Codemagic CI for Ant Colony Colors (Unity -> Xcode -> TestFlight).
workflows:
  ios-release:
    name: Ant Colony Colors iOS
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: "Ant Colony Colors: Sort Puzzle"
    environment:
      groups:
        - unity_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.antcolonycolors.game
      vars:
        UNITY_VERSION: 6000.6.7f1
        UNITY_CHANGESET: b22767f04f04
        EXPORT_DIR: Builds/AntColonyColors-iOS
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Unity (with iOS support)
        script: |
          UNITY_APP="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app"
          if [ ! -d "$UNITY_APP" ]; then
            HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
            if [ ! -x "$HUB" ]; then
              curl -fsSL -o /tmp/UnityHubSetup.dmg https://public-cdn.cloud.unity3d.com/hub/prod/UnityHubSetup.dmg
              hdiutil attach /tmp/UnityHubSetup.dmg -nobrowse -quiet
              cp -R "/Volumes/Unity Hub"*/"Unity Hub.app" /Applications/
              hdiutil detach "/Volumes/Unity Hub"* -quiet || true
            fi
            "$HUB" -- --headless install --version "$UNITY_VERSION" --changeset "$UNITY_CHANGESET"
            "$HUB" -- --headless install-modules --version "$UNITY_VERSION" --module ios
          fi
          echo "UNITY_BIN=$UNITY_APP/Contents/MacOS/Unity" >> $CM_ENV
      - name: Activate Unity license
        script: |
          if [ -n "$UNITY_SERIAL" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile -
          elif [ -n "$UNITY_LICENSE" ]; then
            mkdir -p "/Library/Application Support/Unity"
            echo "$UNITY_LICENSE" > "/Library/Application Support/Unity/Unity_lic.ulf"
          else
            echo "No Unity license provided"; exit 1
          fi
      - name: Export Xcode project from Unity
        script: |
          "$UNITY_BIN" -batchmode -nographics -quit -buildTarget iOS \
            -projectPath "$CM_BUILD_DIR/AntchemyUnity" \
            -executeMethod Antchemy.Editor.SceneSetup.BuildIOS \
            -logFile - || { echo "Unity export failed"; exit 1; }
      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/$EXPORT_DIR"
          if [ -f Podfile ]; then pod install --repo-update; fi
      - name: Set provisioning profile and build number
        script: |
          cd "$CM_BUILD_DIR/$EXPORT_DIR"
          xcode-project use-profiles
          # Next build number = latest TestFlight build + 1 (falls back to Codemagic's own counter).
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0;; esac
          NEXT=$((LATEST + 1))
          if [ "$NEXT" -le "${BUILD_NUMBER:-0}" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Using build number $NEXT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" Info.plist
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/$EXPORT_DIR"
          if [ -d Unity-iPhone.xcworkspace ]; then
            xcode-project build-ipa --workspace "$PWD/Unity-iPhone.xcworkspace" --scheme Unity-iPhone
          else
            xcode-project build-ipa --project "$PWD/Unity-iPhone.xcodeproj" --scheme Unity-iPhone
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
