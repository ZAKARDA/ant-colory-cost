
workflows:
  ios-release:
    name: Ant Colony Colors - Signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: AntColonyKey

    environment:
      groups:
        - github_artifact

      ios_signing:
        certificates:
          - AntColonyAppStoreCert
        provisioning_profiles:
          - AntColonyAppStoreProfile

      vars:
        GITHUB_REPO: "ZAKARDA/ant-colory-cost"
        GITHUB_RUN_ID: "43316049436"
        IOS_BUNDLE_ID: "com.antcolonycolors.game"

      xcode: latest
      cocoapods: default

    scripts:
      - name: Download Unity Xcode Project
        script: |
          set -euo pipefail

          : "${GITHUB_ARTIFACT_TOKEN:?Missing GitHub token}"

          API="https://api.github.com/repos/$GITHUB_REPO"

          curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ARTIFACT_TOKEN" \
            "$API/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            -o /tmp/artifacts.json

          ARTIFACT_ID="$(python3 - <<'PY'
          import json
          with open("/tmp/artifacts.json") as f:
              data = json.load(f)
          matches = [
              a for a in data.get("artifacts", [])
              if a.get("name") == "iOS-Xcode-Project"
              and not a.get("expired", False)
          ]
          if not matches:
              raise SystemExit("iOS artifact missing or expired")
          print(matches[0]["id"])
          PY
          )"

          curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ARTIFACT_TOKEN" \
            "$API/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/ios-project.zip

          mkdir -p "$CM_BUILD_DIR/ios-export"
          unzip -q /tmp/ios-project.zip \
            -d "$CM_BUILD_DIR/ios-export"

          PROJECT=$(find "$CM_BUILD_DIR/ios-export" \
            -type d -name "Unity-iPhone.xcodeproj" \
            -print -quit)

          test -n "$PROJECT"

          IOS_DIR=$(dirname "$PROJECT")
          echo "IOS_DIR=$IOS_DIR" >> "$CM_ENV"

          echo "Xcode project downloaded successfully"

      - name: Install CocoaPods
        script: |
          set -e
          cd "$IOS_DIR"
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Fix Script Permissions
        script: |
          find "$IOS_DIR" -type f -name "*.sh" \
            -exec chmod +x {} \;

      - name: Configure Apple Code Signing
        script: |
          set -euo pipefail
          cd "$IOS_DIR"

          xcode-project use-profiles \
            --project "$IOS_DIR/Unity-iPhone.xcodeproj" \
            --archive-method app-store

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          source = Path.home() / "export_options.plist"
          target = Path(os.environ["IOS_DIR"]) / "ExportOptions.plist"

          with source.open("rb") as f:
              options = plistlib.load(f)

          if not isinstance(options, dict):
              raise SystemExit("Invalid export options")

          profiles = options.get("provisioningProfiles", {})
          bundle_id = os.environ["IOS_BUNDLE_ID"]

          if bundle_id not in profiles:
              raise SystemExit(
                  f"No provisioning profile for {bundle_id}"
              )

          options["method"] = "app-store-connect"
          options["destination"] = "export"

          with target.open("wb") as f:
              plistlib.dump(options, f, fmt=plistlib.FMT_XML)

          with target.open("rb") as f:
              verified = plistlib.load(f)

          assert verified["method"] == "app-store-connect"

          print("ExportOptions verified")
          print("Method:", verified["method"])
          print("Bundle ID:", bundle_id)
          PY

          plutil -lint "$IOS_DIR/ExportOptions.plist"

      - name: Archive and Export Signed IPA
        script: |
          set -euo pipefail
          cd "$IOS_DIR"

          ARCHIVE_PATH="$IOS_DIR/build/ios/xcarchive/AntColonyColors.xcarchive"
          IPA_DIR="$IOS_DIR/build/ios/ipa"
          EXPORT_PLIST="$IOS_DIR/ExportOptions.plist"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          mkdir -p "$IPA_DIR"

          echo "Starting Xcode archive..."

          if [ -d "Unity-iPhone.xcworkspace" ]; then
            xcodebuild archive \
              -workspace "$IOS_DIR/Unity-iPhone.xcworkspace" \
              -scheme "Unity-iPhone" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              2>&1 | tee "$CM_BUILD_DIR/archive.log"
          else
            xcodebuild archive \
              -project "$IOS_DIR/Unity-iPhone.xcodeproj" \
              -scheme "Unity-iPhone" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              2>&1 | tee "$CM_BUILD_DIR/archive.log"
          fi

          echo "Archive complete. Exporting IPA..."

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            2>&1 | tee "$CM_BUILD_DIR/export.log"

          echo "Checking IPA output..."

          find "$IPA_DIR" -name "*.ipa" -type f -print

          if ! find "$IPA_DIR" -name "*.ipa" -type f | grep -q .; then
            echo "ERROR: No IPA produced"
            exit 1
          fi

          echo "Signed IPA exported successfully!"

    artifacts:
      - ios-export/**/build/ios/ipa/*.ipa
      - archive.log
      - export.log

    publishing:
      app_store_connect:
        auth: integration

